# Render free web services 15 min idle ke baad so jate hain aur kabhi-kabhi
# request par wapas nahi uthte (FireX me yahi "URL kaam nahi kar raha" bana tha).
#
# GitHub cron kabhi-kabhi ghanton delay hota hai, isliye har run EK LAMBA job
# chalata hai jo ~5.5 ghante tak har 4 minute me ping karta hai. Agla cron run
# purane ko replace kar deta hai → lagbhag continuous coverage.
# Public repo hai, isliye GitHub Actions minutes free hain.
name: FireX keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firex-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Keep FireX awake
        run: |
          URL="https://firex-3mup.onrender.com/api/health"
          END=$(( $(date +%s) + 325 * 60 ))
          echo "keep-alive until $(date -u -d "@$END" +%H:%M:%SZ 2>/dev/null || echo '+325m')"
          while [ "$(date +%s)" -lt "$END" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                   -H 'Cache-Control: no-cache' "$URL" || true)
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) -> HTTP $code"
            sleep 240
          done
          echo "keep-alive window complete"
