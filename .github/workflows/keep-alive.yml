# Render free web services 15 min idle ke baad so jate hain aur kabhi-kabhi
# request par wapas nahi uthte (FireX me yahi "URL kaam nahi kar raha" bana tha).
# Ye workflow har 5 minute me /api/health ping karta hai → instance jagaa rehta hai.
# Public repo hai, isliye GitHub Actions minutes free hain.
name: FireX keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firex-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping FireX health
        run: |
          URL="https://firex-3mup.onrender.com/api/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
                   -H 'Cache-Control: no-cache' "$URL" || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "FireX is awake"; exit 0; fi
            sleep 5
          done
          # Green rakho taaki spam email na aaye; warning log me rahegi.
          echo "::warning::FireX health did not return 200 on this ping"
          exit 0
