  /* cinematic light, vignette, gloss sweep, embers */
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 70% at 50% 34%,transparent 42%,rgba(8,8,12,.34) 100%)}
  .sweep{position:absolute;top:-30%;left:-60%;width:38%;height:170%;pointer-events:none;
    transform:skewX(-18deg);mix-blend-mode:screen;opacity:.45;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    animation:sweep 5.2s ease-in-out infinite}
  @keyframes sweep{0%{left:-60%}55%{left:130%}100%{left:130%}}
  .ember{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;
    background:#ffb62e;box-shadow:0 0 12px 3px rgba(255,150,20,.75);opacity:0;
    animation:ember 4.6s linear infinite}
  @keyframes ember{0%{opacity:0;transform:translateY(20px) scale(.5)}
    18%{opacity:.9}80%{opacity:.55}100%{opacity:0;transform:translateY(-190px) scale(1.25)}}

  /* --- bottom loading console --- */
  .console{position:absolute;left:0;right:0;bottom:0;padding:0 28px calc(24px + env(safe-area-inset-bottom));
    background:linear-gradient(to bottom,rgba(255,255,255,0) 0%,rgba(255,255,255,.97) 20%,#fff 48%);
    color:#14151a;text-align:center}
  .features{display:flex;justify-content:center;gap:6px;margin:44px 0 18px;
    animation:fadeUp .8s .35s both}
  .feature{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:7px;
    font-size:9.5px;font-weight:800;letter-spacing:.11em;color:#1b1c22;
    animation:fadeUp .7s both}
  .feature:nth-child(1){animation-delay:.45s}.feature:nth-child(2){animation-delay:.58s}
  .feature:nth-child(3){animation-delay:.71s}
  .feature svg{width:27px;height:27px;stroke:#17181e;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(255,150,0,.25))}
  .sep{width:1px;height:26px;background:linear-gradient(#ffb020,#ff7a00);opacity:.55;align-self:center}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .loading{font-size:13px;font-weight:800;letter-spacing:.32em;color:#16171c;margin:0 0 12px}
  .dots::after{content:'';animation:dots 1.4s steps(4,end) infinite}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}

  .track{position:relative;height:12px;border-radius:99px;background:#e7e7ec;overflow:visible;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#ff7a00,#ff9d00 45%,#ffc72c);
    box-shadow:0 0 16px rgba(255,140,0,.6);will-change:width}
  .fill::after{content:'';position:absolute;inset:0;border-radius:99px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
    transform:translateX(-100%);animation:shimmer 1.5s linear infinite}
  @keyframes shimmer{to{transform:translateX(100%)}}
  .spark{position:absolute;top:50%;width:30px;height:30px;left:0;pointer-events:none;
    transform:translate(-50%,-50%);filter:drop-shadow(0 0 9px rgba(140,60,255,.9));
    animation:sparkPulse 1.3s ease-in-out infinite}
  @keyframes sparkPulse{0%,100%{transform:translate(-50%,-50%) scale(.92)}
    50%{transform:translate(-50%,-50%) scale(1.12)}}

  .foot{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;
    font-size:10px;font-weight:800;letter-spacing:.28em;color:#1c1d23}
  .foot i{display:block;width:26px;height:2px;border-radius:2px;background:#ff9d00}
  .pct{font-variant-numeric:tabular-nums;letter-spacing:.08em;color:#ff7a00;font-weight:800}

  /* final brand flash */
  .brand{position:absolute;left:0;right:0;top:8.5%;text-align:center;pointer-events:none;
    font-size:11px;font-weight:800;letter-spacing:.45em;color:rgba(255,255,255,.0);
    animation:brandIn 5.2s ease-in-out infinite}
  @keyframes brandIn{0%,72%{opacity:0;letter-spacing:.7em}82%{opacity:.9;letter-spacing:.45em}
    100%{opacity:0;letter-spacing:.45em}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

<script>
  // embers
  const box = document.getElementById('embers');
  for (let i = 0; i < 14; i++) {
    const e = document.createElement('span');
    e.className = 'ember';
    e.style.left = (8 + Math.random() * 84) + '%';
    e.style.top = (48 + Math.random() * 40) + '%';
    e.style.animationDelay = (Math.random() * 4.6) + 's';
    e.style.animationDuration = (3.4 + Math.random() * 2.6) + 's';
    e.style.width = e.style.height = (3 + Math.random() * 4).toFixed(1) + 'px';
    box.appendChild(e);
  }

  // progress loop (replace with real Firebase/Firestore load events in the app)
  const fill = document.getElementById('fill');
  const spark = document.getElementById('spark');
  const pct = document.getElementById('pct');
  const CYCLE = 5200, RUN = 4300;
  const t0 = performance.now();
  function tick(t) {
    const p = Math.min(1, ((t - t0) % CYCLE) / RUN);
    const eased = 1 - Math.pow(1 - p, 2.1);
    const v = Math.round(eased * 100);
    fill.style.width = v + '%';
    spark.style.left = v + '%';
    pct.textContent = v + '%';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
